<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Q1 Paper Reviewer</title>
  <meta name="description" content="Multi-agent, evidence-first pre-submission review for research manuscripts targeting Scopus Q1 journals.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d3557'/%3E%3Cpath d='M18 20h20a8 8 0 0 1 0 16H26v10h-8z' fill='%23f1e9da'/%3E%3Ccircle cx='44' cy='44' r='7' fill='%232a9d8f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">Q1</span>
      <span class="brand-text">Paper Reviewer<small>Pre-submission review engine</small></span>
    </a>
    <nav class="topnav">
      <a href="#/" data-nav="home">New review</a>
      <a href="#/reviews" data-nav="reviews">My reviews</a>
      <a href="#/demo" data-nav="demo">Sample report</a>
      <a href="#/how" data-nav="how">How it works</a>
      <button class="btn btn-ghost" id="settingsBtn" type="button" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.43-2.53a7.8 7.8 0 0 0 0-1.94l2.03-1.58-1.92-3.32-2.39.96a7.4 7.4 0 0 0-1.68-.98L15.1 3.5h-3.84l-.37 2.61c-.6.24-1.17.57-1.68.98l-2.39-.96-1.92 3.32 2.03 1.58a7.8 7.8 0 0 0 0 1.94l-2.03 1.58 1.92 3.32 2.39-.96c.51.41 1.08.74 1.68.98l.37 2.61h3.84l.37-2.61c.6-.24 1.17-.57 1.68-.98l2.39.96 1.92-3.32-2.03-1.58Z"/></svg>
        <span>Settings</span>
      </button>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <p>AI-assisted decision support. Every finding must be validated by a human reviewer before you act on it. Built on n8n · Claude · Gemini · Crossref.</p>
  </footer>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" id="settingsForm">
      <h2>Settings</h2>
      <label class="field">
        <span>Access key <em>required</em></span>
        <input type="password" id="setKey" autocomplete="off" placeholder="q1k-…" required>
        <small>Ask the site owner for the key. It is stored only in this browser.</small>
      </label>
      <label class="field">
        <span>API base URL</span>
        <input type="url" id="setApi" placeholder="https://…/webhook">
        <small>The n8n webhook base. Leave as-is unless you moved the workflow.</small>
      </label>
      <p class="settings-status" id="settingsStatus" role="status"></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="testKeyBtn">Test connection</button>
        <button type="button" class="btn btn-ghost" id="closeSettings">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveSettings">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
